name: Build Thunderlink

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: x86_64-apple-darwin
            name: macOS-x64
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS-arm64
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            name: Linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows

    runs-on: ${{ matrix.platform }}
    name: Build (${{ matrix.name }})

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Clean install (Unix)
        if: runner.os != 'Windows'
        run: |
          rm -rf node_modules package-lock.json
          npm install

      - name: Clean install (Windows)
        if: runner.os == 'Windows'
        run: |
          if (Test-Path node_modules) { Remove-Item -Recurse -Force node_modules }
          if (Test-Path package-lock.json) { Remove-Item -Force package-lock.json }
          npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'Thunderlink v__VERSION__'
          releaseBody: |
            ## ⚡ Thunderlink v__VERSION__
            
            High-speed file transfer over Thunderbolt/USB-C.
            
            ### 📥 Download
            
            | Platform | File |
            |----------|------|
            | **macOS (Apple Silicon)** | `Thunderlink_*_aarch64.dmg` |
            | **macOS (Intel)** | `Thunderlink_*_x64.dmg` |
            | **Windows** | `Thunderlink_*_x64-setup.exe` |
            | **Linux** | `Thunderlink_*_amd64.AppImage` or `.deb` |
            
            ### 🍎 macOS: "App is damaged" fix
            
            macOS blocks unsigned apps. After downloading, run in Terminal:
            ```bash
            xattr -cr /Applications/Thunderlink.app
            ```
            Or right-click the app → Open → Open anyway.
            
            ### 🪟 Windows: SmartScreen warning
            
            Click "More info" → "Run anyway" if Windows SmartScreen appears.
          releaseDraft: true
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: thunderlink-${{ matrix.name }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/*.app
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe

